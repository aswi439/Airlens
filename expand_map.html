<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Map Expand Motion Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #090b0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Subtle background radial glow */
    .bg-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(52, 211, 153, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.25em;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 24px;
      user-select: none;
    }

    /* Map Card Container */
    .map-container {
      position: relative;
      perspective: 1000px;
      cursor: pointer;
      user-select: none;
    }

    .map-card {
      position: relative;
      width: 240px;
      height: 140px;
      border-radius: 20px;
      background: #0f131a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      transition: width 0.45s cubic-bezier(0.34, 1.45, 0.64, 1),
                  height 0.45s cubic-bezier(0.34, 1.45, 0.64, 1),
                  transform 0.15s ease-out,
                  box-shadow 0.3s ease;
      transform-style: preserve-3d;
    }

    .map-card.is-expanded {
      width: 370px;
      height: 280px;
      border-color: rgba(52, 211, 153, 0.3);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(52, 211, 153, 0.15);
    }

    /* Background Grid Pattern for Collapsed state */
    .grid-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .map-card.is-expanded .grid-pattern {
      opacity: 0;
    }

    /* Expanded Vector Map Roads & Buildings Overlay */
    .expanded-overlay {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease 0.1s;
      background: #111620;
    }
    .map-card.is-expanded .expanded-overlay {
      opacity: 1;
    }

    /* Road Lines SVG Animation */
    .road-line {
      stroke: rgba(255, 255, 255, 0.25);
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      transition: stroke-dashoffset 0.8s ease-out 0.15s;
    }
    .map-card.is-expanded .road-line {
      stroke-dashoffset: 0;
    }

    .sec-road {
      stroke: rgba(255, 255, 255, 0.12);
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      transition: stroke-dashoffset 0.6s ease-out 0.3s;
    }
    .map-card.is-expanded .sec-road {
      stroke-dashoffset: 0;
    }

    /* Building Blocks */
    .building {
      position: absolute;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .map-card.is-expanded .building {
      opacity: 1;
      transform: scale(1);
    }
    .b1 { top: 38%; left: 10%; width: 16%; height: 22%; transition-delay: 0.3s; }
    .b2 { top: 15%; left: 36%; width: 14%; height: 16%; transition-delay: 0.35s; }
    .b3 { top: 68%; left: 74%; width: 18%; height: 18%; transition-delay: 0.4s; }
    .b4 { top: 20%; right: 10%; width: 12%; height: 26%; transition-delay: 0.45s; }
    .b5 { top: 58%; left: 5%; width: 8%; height: 14%; transition-delay: 0.5s; }

    /* Animated Pin Marker */
    .pin-marker {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s;
    }
    .map-card.is-expanded .pin-marker {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Card Content Layout */
    .card-content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Top Section */
    .top-section {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .map-icon {
      color: #34D399;
      transition: filter 0.3s ease, opacity 0.3s ease;
      filter: drop-shadow(0 0 5px rgba(52, 211, 153, 0.4));
    }
    .map-container:hover .map-icon {
      filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.8));
    }
    .map-card.is-expanded .map-icon-wrap {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .map-container:hover .live-badge {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.09);
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 8px #34D399;
    }

    /* Bottom Section */
    .bottom-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .location-title {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.01em;
      transition: transform 0.3s ease;
    }
    .map-container:hover .location-title {
      transform: translateX(4px);
    }

    .coordinates {
      font-family: monospace;
      font-size: 11px;
      color: #94a3b8;
      opacity: 0;
      max-height: 0;
      transform: translateY(-6px);
      transition: all 0.3s ease;
    }
    .map-card.is-expanded .coordinates {
      opacity: 1;
      max-height: 24px;
      transform: translateY(0);
    }

    /* Animated Underline */
    .underline {
      height: 1px;
      margin-top: 4px;
      background: linear-gradient(90deg, rgba(52, 211, 153, 0.6), rgba(52, 211, 153, 0.2), transparent);
      transform-origin: left center;
      transform: scaleX(0.3);
      transition: transform 0.4s ease-out;
    }
    .map-container:hover .underline,
    .map-card.is-expanded .underline {
      transform: scaleX(1);
    }

    /* Hint text below card */
    .hint-text {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .map-container:hover .hint-text {
      opacity: 1;
      bottom: -24px;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="label">CURRENT LOCATION</div>

  <div class="map-container" id="mapContainer">
    <div class="map-card" id="mapCard">

      <!-- Grid pattern for collapsed state -->
      <svg class="grid-pattern" width="100%" height="100%">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="0.5" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
      </svg>

      <!-- Vector Map Overlay for Expanded state -->
      <div class="expanded-overlay">
        <svg width="100%" height="100%" preserveAspectRatio="none" style="position:absolute; inset:0;">
          <!-- Horizontal Main Roads -->
          <line x1="0%" y1="35%" x2="100%" y2="35%" class="road-line" stroke-width="4"/>
          <line x1="0%" y1="65%" x2="100%" y2="65%" class="road-line" stroke-width="4"/>
          <!-- Vertical Main Roads -->
          <line x1="30%" y1="0%" x2="30%" y2="100%" class="road-line" stroke-width="3"/>
          <line x1="70%" y1="0%" x2="70%" y2="100%" class="road-line" stroke-width="3"/>
          <!-- Secondary Streets -->
          <line x1="0%" y1="20%" x2="100%" y2="20%" class="sec-road" stroke-width="1.5"/>
          <line x1="0%" y1="50%" x2="100%" y2="50%" class="sec-road" stroke-width="1.5"/>
          <line x1="0%" y1="80%" x2="100%" y2="80%" class="sec-road" stroke-width="1.5"/>
          <line x1="15%" y1="0%" x2="15%" y2="100%" class="sec-road" stroke-width="1.5"/>
          <line x1="45%" y1="0%" x2="45%" y2="100%" class="sec-road" stroke-width="1.5"/>
          <line x1="85%" y1="0%" x2="85%" y2="100%" class="sec-road" stroke-width="1.5"/>
        </svg>

        <!-- Building blocks -->
        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>

        <!-- Animated Pin Marker -->
        <div class="pin-marker">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#34D399" style="filter: drop-shadow(0 0 12px rgba(52, 211, 153, 0.7));"/>
            <circle cx="12" cy="9" r="2.5" fill="#0f131a" />
          </svg>
        </div>
      </div>

      <!-- Card Content -->
      <div class="card-content">
        <!-- Top -->
        <div class="top-section">
          <div class="map-icon-wrap">
            <svg class="map-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
              <line x1="9" x2="9" y1="3" y2="18" />
              <line x1="15" x2="15" y1="6" y2="21" />
            </svg>
          </div>
          <div class="live-badge">
            <div class="live-dot"></div>
            <span>Live</span>
          </div>
        </div>

        <!-- Bottom -->
        <div class="bottom-section">
          <div class="location-title" id="locTitle">San Francisco, CA</div>
          <div class="coordinates" id="locCoords">37.7749° N, 122.4194° W</div>
          <div class="underline"></div>
        </div>
      </div>

    </div>

    <div class="hint-text" id="hintText">Click to expand</div>
  </div>

  <script>
    const container = document.getElementById('mapContainer');
    const card = document.getElementById('mapCard');
    const hint = document.getElementById('hintText');
    let isExpanded = false;

    // Click toggle expansion
    container.addEventListener('click', () => {
      isExpanded = !isExpanded;
      card.classList.toggle('is-expanded', isExpanded);
      hint.textContent = isExpanded ? 'Click to collapse' : 'Click to expand';
    });

    // 3D Motion Tilt on Mouse Move
    container.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const mouseX = e.clientX - centerX;
      const mouseY = e.clientY - centerY;
      const rotateX = (-mouseY / (rect.height / 2)) * 8;
      const rotateY = (mouseX / (rect.width / 2)) * 8;
      card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
    });

    container.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  </script>
</body>
</html>
